<style id="store-css">
/* Layout: dark storefront; every color derives from 4 tokens the admin can change (accent, background, surface, text) */
:root{
  --green:#2fa865; --bg:#060807; --surface:#0d110f; --text:#e9efeb; --on-accent:#03140a;
  --raise:color-mix(in srgb,var(--surface) 94%,#fff);
  --line:color-mix(in srgb,var(--text) 11%,var(--bg));
  --muted:color-mix(in srgb,var(--text) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--text) 34%,var(--bg));
  --soft:color-mix(in srgb,var(--text) 80%,var(--bg));
  --green-deep:color-mix(in srgb,var(--green) 32%,#000);
  --green-tint:color-mix(in srgb,var(--green) 14%,var(--bg));
  --glow:color-mix(in srgb,var(--green) 45%,transparent);
  --glow-soft:color-mix(in srgb,var(--green) 22%,transparent);
  --r-sm:6px; --r-md:10px; --r-lg:16px; --gcols:4; --logo-h:24px; --base:16px;
  --warn-bg:#241c08; --warn-line:#4a3a10; --warn-text:#e8c76a;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:var(--base)/1.6 var(--body)}
body.nostick header{position:relative;top:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.01em}
.label{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.muted{color:var(--muted)} .small{font-size:14px} .mono{font-family:var(--mono)}

.ruo-bar{background:var(--green-deep);color:color-mix(in srgb,#fff 88%,var(--green));font:500 12px/1.4 var(--mono);letter-spacing:.03em;text-align:center}
.ruo-bar .wrap{padding-block:9px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.logo img{height:var(--logo-h);width:auto;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
/* tabs: green glow on hover, matching the product images */
nav a{font-weight:500;color:var(--muted);padding:7px 14px;border-radius:999px;border:1px solid transparent;transition:color .3s ease,border-color .3s ease,box-shadow .3s ease,background-color .3s ease,text-shadow .3s ease}
nav a:hover,nav a:focus-visible{color:var(--text);border-color:var(--glow);background:var(--green-tint);box-shadow:0 0 0 1px var(--glow-soft),0 0 22px -4px var(--glow);text-shadow:0 0 14px var(--glow)}
nav a.on{color:var(--text);border-color:var(--line)}
.cartlink{display:flex;align-items:center;gap:8px;border-color:var(--line)!important;color:var(--text)!important;margin-left:6px}
.cartlink:hover{border-color:var(--glow)!important}
.cartlink b{background:var(--green);color:var(--on-accent);font:600 12px/1 var(--mono);border-radius:999px;padding:4px 7px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--green);border-radius:var(--r-sm);padding:12px 22px;font-weight:600;background:var(--green);color:var(--on-accent);transition:filter .2s,border-color .2s,box-shadow .3s}
.btn:hover{filter:brightness(1.1);box-shadow:0 0 22px -6px var(--glow)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--green);filter:none}
.btn.small{padding:8px 14px;font-size:14px}

main{min-height:55vh}
section{padding-block:64px}

.hero{background:radial-gradient(900px 420px at 88% -10%,var(--glow-soft),transparent 70%),var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center}
.hero-in.solo{grid-template-columns:1fr}
.hero-in.img-left{grid-template-columns:1fr 1.15fr}
.hero-in.img-left .hero-media{order:-1}
.hero.noglow{background:var(--bg)}
.hero-in.solo .hero-copy{max-width:760px}
.hero h1{font-size:clamp(36px,5.6vw,64px);font-weight:800;margin:16px 0 18px}
.hero p{color:var(--muted);font-size:18px;max-width:52ch;margin:0 0 28px;white-space:pre-line}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
/* cover image: soft glow, gentle parallax while scrolling, zoom + brighter glow on hover */
.hero-media{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface);
  box-shadow:0 0 0 1px var(--glow-soft),0 30px 80px -40px var(--glow),0 0 60px -30px var(--glow);
  transform:translate3d(0,var(--py,0px),0);transition:border-color .4s ease,box-shadow .4s ease;will-change:transform}
.hero-media img{display:block;width:100%;max-height:560px;object-fit:cover;transform:scale(var(--ps,1));transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .6s ease}
.hero-media:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--glow),0 0 40px -6px var(--glow),0 30px 80px -36px var(--glow)}
.hero-media:hover img{transform:scale(calc(var(--ps,1) * 1.05));filter:brightness(1.06)}
.hero-media.enter{opacity:0;translate:0 26px;scale:.98}
.hero-media.enter.in{opacity:1;translate:0 0;scale:1;transition:opacity 1s ease,translate 1s cubic-bezier(.2,.7,.2,1),scale 1s cubic-bezier(.2,.7,.2,1),border-color .4s ease,box-shadow .4s ease}

.facts{border-bottom:1px solid var(--line)}
.facts-in{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:24px;padding-block:26px}
.facts strong{display:block;font-family:var(--display);font-size:16px}
.facts span{color:var(--muted);font-size:14px}

.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sechead h2{font-size:clamp(26px,3.4vw,38px);margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(var(--gcols),minmax(0,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card-link{display:flex;flex-direction:column;gap:10px;flex:1}
.cardbtn{width:100%;margin-top:auto}
.thumb{aspect-ratio:1;max-width:100%;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--faint);font:500 11px var(--mono);letter-spacing:.08em;transition:border-color .35s ease,box-shadow .35s ease}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s ease}
.thumb:hover,.card:hover .thumb,.gallery .thumbs button:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--glow-soft),0 0 28px -4px var(--glow),0 18px 40px -22px var(--glow)}
.thumb:hover img,.card:hover .thumb img{transform:scale(1.06);filter:brightness(1.06)}
.sku{font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font:600 16px/1.3 var(--body)}
.price{font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .sub{font-size:13px;color:var(--muted)}
.badge{display:inline-block;align-self:flex-start;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--green);color:var(--on-accent)}
.thumb{position:relative}
.thumb .badge{position:absolute;top:10px;left:10px;z-index:1}
.ruo-tag{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.card.placeholder h3,.card.placeholder .price,.card.placeholder .sub{color:var(--faint)}
.pill{display:inline-block;font:500 11px var(--mono);padding:3px 8px;border-radius:999px;background:var(--green-tint);color:var(--green)}
.pill.out{background:var(--raise);color:var(--muted)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface);color:var(--text);font-size:14px;transition:border-color .3s,box-shadow .3s}
.chip:hover{border-color:var(--glow);box-shadow:0 0 16px -6px var(--glow)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none}

.crumbs{font:400 13px var(--mono);color:var(--muted);margin-bottom:20px}
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:56px}
.gallery{display:grid;gap:12px;min-width:0}
.gallery .thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gallery .thumbs button{padding:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);aspect-ratio:1;overflow:hidden;transition:border-color .3s ease,box-shadow .3s ease}
.gallery .thumbs button.on{border-color:var(--green)}
.gallery .thumbs img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.gallery .thumbs button:hover img{transform:scale(1.08)}
.pinfo{display:flex;flex-direction:column;gap:18px;min-width:0}
.pinfo h1{font-size:clamp(28px,3.6vw,42px)}
.pinfo .price{font-size:24px}
.ruo-box{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);border-radius:var(--r-md);padding:14px 16px;font-size:14px}
.ruo-box strong{display:block;margin-bottom:2px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.qty button{background:var(--raise);border:0;width:42px;height:46px;font-size:18px;color:var(--text)}
.qty output{width:48px;display:grid;place-items:center;font-family:var(--mono)}
.buyrow{display:flex;gap:12px;flex-wrap:wrap}
.buyrow .btn{flex:1}
.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs td{border-top:1px solid var(--line);padding:11px 0;vertical-align:top}
.specs td:first-child{color:var(--muted);width:40%}
.desc{white-space:pre-line;color:var(--soft)}
.coa-link{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;transition:border-color .3s,box-shadow .3s}
a.coa-link:hover{border-color:var(--glow);box-shadow:0 0 22px -8px var(--glow)}
.coa-link b{font-family:var(--display)}

.cartwrap{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.line .rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.line .qty button{height:34px;width:32px}
.line .qty output{width:36px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;gap:14px}
.summary .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.summary .total{border-top:1px solid var(--line);padding-top:14px;font-weight:600;font-size:18px}
.attest{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft)}
.attest input{margin-top:3px;accent-color:var(--green)}
.empty{border:1px dashed var(--line);border-radius:var(--r-md);padding:48px 24px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:18px}
.note{font-size:14px;color:var(--green);margin:0}

/* custom pages */
.prose{max-width:72ch}
.prose h1{font-size:clamp(32px,4.6vw,50px);margin:12px 0 22px}
.sec{margin-top:30px}
.sec:first-of-type{margin-top:0}
.sec h2{font-size:22px;margin-bottom:10px}
.sec p,.sec li{color:var(--soft)}
.sec ul{padding-left:20px}
.sec-img{margin:0;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);transition:border-color .35s ease,box-shadow .35s ease}
.sec-img img{display:block;width:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.sec-img:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--glow-soft),0 0 30px -6px var(--glow)}
.sec-img:hover img{transform:scale(1.03)}
.sec-img figcaption{padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line);padding-block:18px}
summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--green);font-family:var(--mono)}
details[open] summary::after{content:"−"}
details p{margin:10px 0 0}

.home-extra{border-top:1px solid var(--line)}
.home-extra .sec{max-width:72ch}
.home-extra .sec-img{max-width:none}
.related{margin-top:64px}
/* customer accounts */
.acct{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;display:flex;flex-direction:column;gap:16px}
.acct.wide{max-width:720px}
.acct h1{font-size:30px}
.acct p{margin:0;color:var(--muted)}
.acct form{display:grid;gap:12px}
.acct label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.acct label.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft)}
.acct label.check input{margin-top:3px;accent-color:var(--green)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:var(--r-sm);padding:11px 16px;font-weight:600;transition:box-shadow .3s}
.gbtn:hover{box-shadow:0 0 22px -6px var(--glow)}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkish{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;font-size:14px}
.acct .err{color:#ef6b5e;font-size:14px;margin:0}
.acct .ok{color:var(--green);font-size:14px;margin:0}
.who{display:flex;align-items:center;gap:14px}
.who img,.who .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--green-tint);display:grid;place-items:center;font:700 20px var(--display);color:var(--green)}
.addr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addr .full{grid-column:1/-1}
.shipnote{display:flex;gap:10px;align-items:flex-start;background:var(--green-tint);border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--soft)}
.shipnote b{color:var(--text)}
.shipnote svg{flex:none;margin-top:2px;color:var(--green)}
/* checkout */
.co{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start}
.co-main{display:flex;flex-direction:column;gap:28px;min-width:0}
.co-block{display:flex;flex-direction:column;gap:12px}
.co-block h2{font-size:20px;display:flex;align-items:center;gap:10px}
.co-block h2 .n{width:26px;height:26px;border-radius:50%;background:var(--green-tint);color:var(--green);font:600 13px var(--mono);display:grid;place-items:center}
.co-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.co-fields .full{grid-column:1/-1}
.co label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.co label.attest{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft)}
.co label.attest input{width:auto;margin-top:3px}
.co input,.co select,.co textarea{width:100%}
.co input:invalid:not(:placeholder-shown){border-color:#a3261b}
.pm-list{display:grid;gap:10px}
.pm{display:grid;grid-template-columns:auto 52px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;transition:border-color .3s,box-shadow .3s}
.pm:hover{border-color:var(--glow);box-shadow:0 0 22px -10px var(--glow)}
.pm.on{border-color:var(--green);box-shadow:0 0 0 1px var(--glow-soft),0 0 26px -10px var(--glow)}
.pm input{accent-color:var(--green);width:auto}
.pm-icon{width:52px;height:52px;border-radius:var(--r-sm);background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font:700 20px var(--display);color:var(--green)}
.pm-icon img{width:100%;height:100%;object-fit:contain}
.pm-name{font-weight:600}
.pm-desc{font-size:13px;color:var(--muted)}
.pm-adj{font:500 12px var(--mono);color:var(--green);white-space:nowrap}
.pm-detail{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;background:var(--bg);display:grid;gap:12px}
.pm-detail p{margin:0;color:var(--soft);white-space:pre-line}
.pm-kv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.pm-kv span{color:var(--muted)}
.pm-kv code{font:500 14px var(--mono);color:var(--text);word-break:break-all}
.copy{background:none;border:1px solid var(--line);color:var(--muted);border-radius:var(--r-sm);padding:4px 10px;font-size:12px}
.copy:hover{color:var(--text);border-color:var(--green)}
.amount{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.amount b{font:600 22px var(--mono)}
.drop{border:2px dashed var(--line);border-radius:var(--r-md);padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .3s,background .3s,box-shadow .3s;display:grid;gap:8px;justify-items:center}
.drop:hover,.drop.over{border-color:var(--green);background:var(--green-tint);box-shadow:0 0 26px -12px var(--glow)}
.drop svg{color:var(--green)}
.drop.has{border-style:solid;border-color:var(--green)}
.drop .file{display:flex;gap:12px;align-items:center;text-align:left}
.drop .file img{width:64px;height:64px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.co .err{color:#ef6b5e;font-size:14px;margin:0}
.co-sum{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px}
.co-sum .it{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;font-size:14px}
.co-sum .it .thumb{aspect-ratio:1;border-radius:var(--r-sm)}
.co-sum .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:14px}
.co-sum .row.total{border-top:1px solid var(--line);padding-top:12px;font-weight:600;font-size:18px}
.codebox{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.codebox label{font-size:13px;color:var(--muted)}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;text-transform:uppercase;font-family:var(--mono)}
.codebox .ok{color:var(--green)}
.co-sum .ordno{font:500 12px var(--mono);color:var(--muted)}
.done{max-width:620px;margin:0 auto;text-align:center;display:grid;gap:14px;justify-items:center}
.done .check{width:64px;height:64px;border-radius:50%;background:var(--green-tint);display:grid;place-items:center;color:var(--green);box-shadow:0 0 40px -10px var(--glow)}
.done p{color:var(--muted);margin:0;white-space:pre-line}
.done .card2{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:8px;font-size:14px}
@media (max-width:960px){.co{grid-template-columns:1fr}.co-sum{position:static}}
@media (max-width:560px){.co-fields{grid-template-columns:1fr}.pm{grid-template-columns:auto 44px 1fr}.pm-adj{grid-column:3}.pm-icon{width:44px;height:44px}}
.sending{position:fixed;inset:0;z-index:65;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;text-align:center}
.sending div{display:grid;gap:12px;justify-items:center;max-width:420px}
.sending h2{font-size:24px}
.sending p{margin:0;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin .8s linear infinite;box-shadow:0 0 30px -8px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.steps{list-style:none;margin:6px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.steps li{display:grid;gap:4px;justify-items:center;text-align:center;font-size:13px;color:var(--faint);position:relative}
.steps li::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.on::before{background:var(--green)}
.steps .dot{width:18px;height:18px;border-radius:50%;background:var(--line);position:relative;z-index:1}
.steps li.on .dot{background:var(--green)}
.steps li.cur .dot{box-shadow:0 0 0 5px var(--green-tint),0 0 22px -2px var(--glow)}
.steps li.on b{color:var(--text)}
.steps b{font-weight:600}
@media (max-width:560px){.steps{grid-template-columns:repeat(2,1fr);row-gap:16px}.steps li::before{display:none}}
.aff-modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.aff-modes button{background:none;border:0;color:var(--muted);padding:10px;font-weight:600}
.aff-modes button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 -2px 0 var(--green)}
.acct .ok{color:var(--green);font-size:14px;margin:0}
.split{display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--bg)}
.split-head{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.split-head b{color:var(--text);font:600 18px var(--mono)}
.split input[type=range]{width:100%;accent-color:var(--green);padding:0;border:0;background:none;height:24px}
.split-ex{font-size:13px;color:var(--muted)}
.lblx{font-size:14px;color:var(--muted)}
.hint{font-size:12px;color:var(--faint)}
.aff-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.aff .st{display:inline-block;font:600 11px var(--mono);padding:4px 10px;border-radius:999px}
.st-new{background:#2a2108;color:#f0c75e}.st-shipped,.st-approved,.st-paid{background:var(--green-tint);color:var(--green)}.st-cancelled,.st-void{background:#2a1210;color:#ef6b5e}
.aff-menu{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin:0;width:auto}
.aff-menu button{background:none;border:1px solid transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:500;transition:color .3s,border-color .3s,box-shadow .3s}
.aff-menu button:hover{color:var(--text);border-color:var(--glow);box-shadow:0 0 18px -6px var(--glow)}
.aff-menu button.on{color:var(--text);border-color:var(--line);background:var(--raise)}
.aff-menu button:last-child{margin-left:auto}
.aff-body{display:grid;gap:16px}
.aff-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.aff-kpi{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:4px;background:var(--bg)}
.aff-kpi span{font-size:12px;color:var(--muted)}
.aff-kpi b{font:600 20px var(--mono)}
.aff-link{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--bg)}
.aff-link code{word-break:break-all;font-size:13px}
.aff-table{display:grid;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.aff-row{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.aff-th{border-top:0;background:var(--raise);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.aff-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.aff-link{grid-template-columns:1fr}.aff-row{grid-template-columns:1fr 1fr;row-gap:4px}.aff-th{display:none}.aff-menu button:last-child{margin-left:0}}
.maint{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.maint div{max-width:520px;display:grid;gap:14px;justify-items:center}
.maint img{height:var(--logo-h);width:auto}
.maint p{color:var(--muted);margin:0;white-space:pre-line}
.disclaimer{background:var(--surface);border-top:1px solid var(--line);padding-block:28px;font-size:13px;color:var(--muted)}
.disclaimer strong{color:var(--text)}
footer{background:color-mix(in srgb,var(--bg) 60%,#000);border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:2fr repeat(var(--fcols,3),1fr);gap:32px;padding-block:52px 28px}
.foot-brand img{height:20px;width:auto}
.foot-brand p{color:var(--muted);font-size:14px;max-width:34ch;margin:12px 0 0;white-space:pre-line}
footer h4{margin:0 0 12px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--soft)}
footer ul a{transition:color .3s,text-shadow .3s}
footer ul a:hover{color:var(--text);text-shadow:0 0 12px var(--glow)}
.legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;color:var(--faint);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.gate{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px}
.gate-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);max-width:480px;width:100%;padding:32px;display:flex;flex-direction:column;gap:12px}
.gate-box img{height:20px;width:auto;align-self:flex-start;margin-bottom:8px}
.gate-box h2{font-size:26px}
.gate-box p{margin:0;color:var(--soft);font-size:15px;white-space:pre-line}
.gate-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--green);color:var(--on-accent);padding:12px 18px;border-radius:var(--r-md);font-weight:600;z-index:60}

/* scroll reveal: only applied by script to content below the first screen */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

@media (max-width:960px){
  .grid{grid-template-columns:repeat(min(2,var(--gcols)),minmax(0,1fr))}
  .hero-in,.hero-in.img-left,.pdp,.cartwrap{grid-template-columns:1fr}
  .hero-in.img-left .hero-media{order:0}
  .facts-in{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  nav{margin-left:0;width:100%;gap:4px;font-size:15px}
  nav a{padding:6px 11px}
  section{padding-block:44px}
  .grid{gap:14px}
  .tools,.tools input,.tools select{width:100%}
  .addr{grid-template-columns:1fr}
  .acct{padding:22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .rv,.hero-media.enter{opacity:1;transform:none;translate:none;scale:none}
  .hero-media{transform:none}
  .thumb:hover img,.card:hover .thumb img,.gallery .thumbs button:hover img,.hero-media:hover img,.sec-img:hover img{transform:none}
}
</style>

":"text","heading":"","body":"We collect the information you give us when you place an order or contact us: your name, email, shipping address and order details. Payment details are handled by our payment processor and are not stored on our servers.\n\nWe use this information to process and ship orders, answer your messages and meet legal obligations. We do not sell your personal information.\n\nIf you subscribe to email updates, every email includes a way to unsubscribe, and we process unsubscribe requests within 10 business days.\n\nTo request a copy of your data or ask us to delete it, contact us at the email address shown in the footer."}]}]}</script>

<template id="admin-tpl"><style>
:root{
  --bg:#060807; --panel:#0d110f; --raise:#131916; --line:#1d2621; --text:#e9efeb; --muted:#8b978f; --faint:#56625b;
  --green:#2fa865; --green-deep:#0a4a28; --green-tint:#0f2a1b;
  --warn-bg:#241c08; --warn-line:#4a3a10; --warn-text:#e8c76a; --red:#ef6b5e; --red-bg:#2a1210;
  --display:"Archivo",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);margin:0;line-height:1.15} h1{font-size:28px} h2{font-size:18px}
a{color:inherit} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:inherit;color:var(--text);min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--green)}
input[type=file]{padding:7px;background:var(--raise)}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none}
label{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
label.inline{display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--green);background:var(--green);color:#03140a;border-radius:6px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)} .btn.ghost:hover{border-color:var(--green);filter:none}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--red);border-color:var(--red);color:#1a0604}
.btn.danger.ghost{background:transparent;color:var(--red);border-color:#4a2420}
.err{color:var(--red);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px} .stack.tight{gap:8px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0;align-self:flex-start}
.linkbtn:hover{color:var(--text)}
.login-box img{height:20px;width:auto;align-self:flex-start}

#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#000;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.side-logo{height:17px;width:auto;margin:0 8px;align-self:flex-start}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{background:none;border:0;color:var(--muted);text-align:left;padding:9px 10px;border-radius:6px}
.side nav button:hover{color:var(--text);background:var(--raise)}
.side nav button.on{color:#03140a;background:var(--green);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px;font-size:14px}
.side-foot a,.side-foot button{color:var(--muted);text-decoration:none;background:none;border:0;padding:0;text-align:left}
.side-foot a:hover,.side-foot button:hover{color:var(--text)}

.main{padding:28px clamp(16px,3vw,40px);min-width:0}
.publishbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--green-tint);border:1px solid #1d4a31;border-radius:10px;padding:12px 16px;margin-bottom:24px;font-size:14px}
.publishbar.error{background:var(--red-bg);border-color:#4a2420;color:var(--red)}
.publishbar.dirty{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-text)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top p{margin:4px 0 0} .top input{width:240px}

.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover{background:var(--raise)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tn{width:44px;height:44px;border-radius:6px;background:var(--raise);border:1px solid var(--line);object-fit:cover;display:block}
.tbl .empty td{text-align:center;padding:40px;color:var(--muted);cursor:default}
.pill{display:inline-block;font:500 11px var(--mono);padding:3px 8px;border-radius:999px;background:var(--raise);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--green-tint);color:var(--green)} .pill.warn{background:var(--warn-bg);color:var(--warn-text)} .pill.bad{background:var(--red-bg);color:var(--red)}

.cards2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel.wide{grid-column:1/-1}
.panel p{margin:6px 0}
.result{font-size:14px;margin-top:12px}
.faq-item{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.checks{margin:0;padding-left:20px;display:grid;gap:6px}
.flags{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--warn-text)}
.flags.ok{background:var(--green-tint);border-color:#1d4a31;color:var(--green)}
.flags mark{background:#5a4610;color:#ffe08a;padding:0 3px;border-radius:3px}
.flags ul{margin:6px 0 0;padding-left:18px}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:flex-end}
.drawer-box{background:var(--panel);border-left:1px solid var(--line);width:min(720px,100%);height:100%;display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.drawer-body{padding:20px 24px 28px;overflow-y:auto;flex:1}
.drawer-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:6px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spec{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px}
.spec button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);width:36px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.imgs figure:first-child{border-color:var(--green)}
.imgs img{width:100%;height:100%;object-fit:cover}
.imgs .ctl{position:absolute;inset:auto 4px 4px 4px;display:flex;justify-content:space-between}
.imgs .ctl button{background:rgba(0,0,0,.75);color:#fff;border:0;border-radius:4px;font-size:12px;padding:2px 7px}
.coa-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}

.pagesgrid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.pg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 12px;cursor:pointer;background:var(--panel)}
.pg:hover{border-color:#2b3a31}
.pg.on{border-color:var(--green);box-shadow:0 0 18px -8px var(--green)}
.pg .t{flex:1;min-width:0}
.pg .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .t span{font:400 11px var(--mono);color:var(--muted)}
.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;width:28px;height:28px;display:grid;place-items:center;font-size:13px;padding:0}
.mini:hover{color:var(--text);border-color:var(--green)}
.mini.del:hover{color:var(--red);border-color:#4a2420}
.sys{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.item-head{display:flex;align-items:center;gap:6px}
.item-head .tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--green);flex:1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:start}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--faint);font-weight:400}
.imgfield{display:grid;gap:8px}
.imgprev{border:1px dashed var(--line);border-radius:8px;min-height:90px;display:grid;place-items:center;overflow:hidden;background:var(--raise);color:var(--faint);font:500 11px var(--mono)}
.imgprev img{max-height:220px;width:auto;max-width:100%;display:block}
.imgprev.dark{background:#000}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:44px;height:38px;padding:2px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.colorrow input:not([type]){font-family:var(--mono)}
.preview{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.8);display:flex;flex-direction:column}
.preview-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.preview-stage{flex:1;display:flex;justify-content:center;overflow:auto;padding:16px}
.preview-stage iframe{width:100%;height:100%;min-height:600px;border:1px solid var(--line);border-radius:10px;background:#000;transition:width .3s}
@media (max-width:860px){.pagesgrid{grid-template-columns:1fr}}
.pmgrid{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.pmgrid .imgprev{min-height:110px;width:110px}
.pmgrid .imgprev img{max-height:100px}
@media (max-width:860px){.pmgrid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--text);font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#03140a;font-weight:600}
.chip b{font:600 11px var(--mono);margin-left:4px;opacity:.8}
.st{display:inline-block;font:600 11px var(--mono);padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.st-new{background:#2a2108;color:#f0c75e}.st-verified{background:#0e2433;color:#6cc3f5}.st-shipped{background:var(--green-tint);color:var(--green)}
.st-delivered{background:#1b1f1d;color:#c9d2cc}.st-cancelled{background:var(--red-bg);color:var(--red)}
.side nav button b{background:#f0c75e;color:#000}
.od-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.od-box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);display:grid;gap:4px;font-size:14px;min-width:0}
.od-box .k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.od-items{display:grid;gap:6px;font-size:14px}
.od-items div{display:flex;justify-content:space-between;gap:12px}
.od-proof{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;display:grid;place-items:center;min-height:120px}
.od-proof img{max-width:100%;max-height:520px;display:block}
@media (max-width:860px){.od-grid{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:4px;min-width:0}
.kpi .k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 28px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font:500 12px var(--mono);color:var(--muted)}
.kpi .d.up{color:var(--green)} .kpi .d.down{color:var(--red)}
.chart{position:relative;width:100%;min-height:220px}
.chart.short{min-height:160px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:2}
.chart .tip b{display:block;font:600 14px var(--mono)}
.chart .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px;align-items:center}
.rank .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r .n{font:500 12px var(--mono);color:var(--muted);text-align:right}
.rank .bar{grid-column:1/-1;height:6px;border-radius:0 4px 4px 0;background:var(--line);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
.rank .none{color:var(--faint);font-size:13px}
.fun{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.fun .bar{height:22px;background:var(--line);border-radius:0 4px 4px 0;overflow:hidden}
.fun .bar i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
.fun .n{font:500 12px var(--mono);text-align:right}
.fun .n small{display:block;color:var(--muted);font-size:11px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fun{grid-template-columns:90px 1fr 70px}}
.rules{background:#000;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);color:#c9d2cc;overflow-x:auto;margin:0;white-space:pre}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:grid;place-items:center;padding:20px}
.confirm-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:400px;width:100%;display:grid;gap:16px}
.confirm-box p{margin:0} .confirm-box .row{justify-content:flex-end}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#03140a;padding:11px 16px;border-radius:8px;z-index:70;font-weight:600}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
  .side nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{margin:0;flex-direction:row;gap:14px}
  .cards2,.grid2{grid-template-columns:1fr}
  .top input{width:100%}
}

    <h1>Admin sign in</h1>
    <form id="unlockForm" class="stack"><div id="unlockArea" class="stack">
      <p class="muted small" style="margin:0">Publishing to <b id="savedRepo"></b></p>
      <label for="pw">Admin password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
      <button class="linkbtn" type="button" id="useOther">Use a different repository or token</button>
    </div></form>
    <form id="setupForm" class="stack"><div id="setupArea" class="stack">
      <p class="muted small" style="margin:0">Connect the GitHub repository your site is published from. You only do this once per device.</p>
      <label for="g_repo">Repository (owner/name)<input id="g_repo" placeholder="regnlabs/store" required autocomplete="off"></label>
      <label for="g_branch">Branch<input id="g_branch" value="main" required autocomplete="off"></label>
      <label for="g_token">GitHub access token<input id="g_token" type="password" required autocomplete="off" placeholder="github_pat_…"></label>
      <p class="muted small" style="margin:-6px 0 0">Create a fine-grained token at github.com → Settings → Developer settings, limited to this repository, with <b>Contents: Read and write</b>.</p>
      <div class="stack" id="pwChoose">
        <label for="g_pw">Choose an admin password<input id="g_pw" type="password" autocomplete="new-password"></label>
        <label for="g_pw2">Repeat password<input id="g_pw2" type="password" autocomplete="new-password"></label>
      </div>
      <p class="muted small" id="noRemember" hidden>This page isn't on HTTPS, so the token won't be remembered. You'll paste it each time.</p>
      <button class="btn" type="submit">Connect and sign in</button>
    </div></form>
    <p class="err" id="loginErr" hidden></p>
  </div>

<script type="text/plain" id="admin-js">
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + Number(n || 0).toFixed(2);
  const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const SITE = location.href.split('#')[0].split('?')[0];

  let data = { site: {}, products: [] };
  let editing = null;               // product being edited (null = new)
  let dirty = false;

  // ---------- helpers ----------
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
  function confirmBox(text, yes = 'Delete') {
    return new Promise(res => {
      $('#confirmText').textContent = text; $('#confirmYes').textContent = yes; $('#confirm').hidden = false;
      const done = v => { $('#confirm').hidden = true; res(v); };
      $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false);
    });
  }
  const cleanSku = v => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 40);
  const toPrice = v => { const n = Math.round(parseFloat(String(v).replace(/[$,]/g, '')) * 100) / 100; return Number.isFinite(n) && n >= 0 ? n : 0; };
  const toInt = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 ? n : 0; };

  // ---------- GitHub ----------
  // The admin saves by committing index.html (and new images/COAs) to your GitHub repository.
  // Your host (GitHub Pages, Cloudflare Pages, Netlify…) redeploys the site from that repository.
  const DATA_RE = /(<script id="store-data" type="application\/json">)([\s\S]*?)(<\/script>)/;
  const gh = { token: '', owner: '', repo: '', branch: 'main', path: 'index.html' };
  let template = '';      // current index.html text in the repository
  let headSha = '';       // latest commit we know about
  let indexSha = '';      // blob sha of index.html in that commit
  const pending = new Map();   // path -> base64 content, waiting for the next commit
  const preview = new Map();   // path -> local URL so new uploads show before they go live

  const b64FromBytes = (bytes) => { let out = ''; for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(out); };
  const b64FromText = (t) => b64FromBytes(new TextEncoder().encode(t));
  const textFromB64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));
  const previewSrc = (u) => preview.get(u) || u;

  function ghError(status, j) {
    const m = (j && j.message) || '';
    if (status === 401) return 'GitHub rejected the token. It may be wrong or expired.';
    if (status === 403 && /rate limit/i.test(m)) return 'GitHub rate limit reached. Wait a few minutes and try again.';
    if (status === 403) return 'This token cannot write to the repository. Give it "Contents: Read and write" access to this repo.';
    if (status === 404) return 'Repository or branch not found. Check the name, the branch, and that the token can access it.';
    if (status === 409 && /empty/i.test(m)) return 'EMPTY_REPO';
    if (status === 422 && /fast forward/i.test(m)) return 'CONFLICT';
    return m || `GitHub returned an error (${status}).`;
  }
  async function ghReq(path, { method = 'GET', body } = {}) {
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}${path}`, {
        method, cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${gh.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch { throw Object.assign(new Error('Could not reach GitHub. Check your connection.'), { status: 0 }); }
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok) throw Object.assign(new Error(ghError(r.status, j)), { status: r.status });
    return j;
  }
  async function readIndex(ref) {
    try {
      const j = await ghReq(`/contents/${encodeURIComponent(gh.path)}?ref=${encodeURIComponent(ref || gh.branch)}`);
      return { text: textFromB64(j.content), sha: j.sha };
    } catch (e) { if (e.status === 404 || e.message === 'EMPTY_REPO') return null; throw e; }
  }
  async function getHead() {
    try { return (await ghReq(`/git/ref/heads/${encodeURIComponent(gh.branch)}`)).object.sha; }
    catch (e) { if (e.status === 404 || e.status === 409 || e.message === 'EMPTY_REPO') return ''; throw e; }
  }
  // one commit containing index.html plus any new images/COAs
  async function commitFiles(files, message) {
    let head = await getHead();
    if (!head) {
      // brand-new empty repository: the first file has to go through the contents API
      const first = files.find(f => f.path === gh.path) || files[0];
      const r = await ghReq(`/contents/${encodeURIComponent(first.path)}`, { method: 'PUT', body: { message, content: first.b64, branch: gh.branch } });
      files = files.filter(f => f !== first);
      head = r.commit.sha;
      if (first.path === gh.path) indexSha = r.content.sha;
      if (!files.length) return head;
    }
    if (headSha && head !== headSha) {
      // someone else committed; only a problem if index.html changed
      const cur = await readIndex(head);
      if (cur && cur.sha !== indexSha) throw Object.assign(new Error('CONFLICT'), { status: 409 });
    }
    const baseTree = (await ghReq(`/git/commits/${head}`)).tree.sha;
    const tree = [];
    for (const f of files) {
      const blob = await ghReq('/git/blobs', { method: 'POST', body: { content: f.b64, encoding: 'base64' } });
      tree.push({ path: f.path, mode: '100644', type: 'blob', sha: blob.sha });
      if (f.path === gh.path) indexSha = blob.sha;
    }
    const t = await ghReq('/git/trees', { method: 'POST', body: { base_tree: baseTree, tree } });
    const c = await ghReq('/git/commits', { method: 'POST', body: { message, tree: t.sha, parents: [head] } });
    await ghReq(`/git/refs/heads/${encodeURIComponent(gh.branch)}`, { method: 'PATCH', body: { sha: c.sha, force: false } });
    return c.sha;
  }

  // ---------- publishing ----------
  const PUBLISH_DELAY = 8000;   // edits made close together go out as one update
  let pubTimer = null, publishing = false, again = false, liveTimer = null, countdown = null;
  function setStatus(kind, text, button) {
    const bar = $('#pubbar');
    bar.classList.toggle('dirty', kind === 'saving');
    bar.classList.toggle('error', kind === 'error');
    $('#pubText').textContent = text;
    const b = $('#quickPublish');
    b.hidden = !button;
    if (button) { b.textContent = button.label; b.onclick = button.run; }
  }
  function markDirty() {
    dirty = true;
    clearTimeout(pubTimer); clearInterval(countdown);
    let left = PUBLISH_DELAY / 1000;
    const tick = () => setStatus('saving', `Unpublished changes · publishing in ${left}s`, { label: 'Publish now', run: publishNow });
    tick(); countdown = setInterval(() => { left = Math.max(0, left - 1); tick(); }, 1000);
    pubTimer = setTimeout(publishNow, PUBLISH_DELAY);
  }
  function publishNow() { clearTimeout(pubTimer); clearInterval(countdown); publish(); }
  async function publish() {
    if (publishing) { again = true; return; }
    publishing = true; again = false; clearTimeout(liveTimer);
    setStatus('saving', 'Publishing to GitHub…');
    try {
      const savedAt = new Date().toISOString();
      data.meta = { savedAt };
      data.github = { owner: gh.owner, repo: gh.repo, branch: gh.branch };
      const json = JSON.stringify(data).replace(/</g, '\\u003c');
      const html = template.replace(DATA_RE, (m, a, b, c) => a + json + c);
      const files = [{ path: gh.path, b64: b64FromText(html) }, ...[...pending].map(([path, b64]) => ({ path, b64 }))];
      const sent = [...pending.keys()];
      headSha = await commitFiles(files, `Store update · ${new Date().toLocaleString()}`);
      template = html;
      sent.forEach(k => pending.delete(k));
      if (!again) { dirty = false; watchLive(savedAt, Date.now()); }
    } catch (err) {
      if (err.message === 'CONFLICT' || err.status === 409) setStatus('error', 'The store was changed from another tab or device. Reload to get the latest version.', { label: 'Reload', run: () => { dirty = false; location.reload(); } });
      else setStatus('error', `Not published: ${err.message}`, { label: 'Try again', run: publishNow });
    } finally {
      publishing = false;
      if (again) publish();
    }
  }
  // after a commit, watch the live site until the host has deployed it

        const prov = new A.GoogleAuthProvider();
        if (prov.setCustomParameters) prov.setCustomParameters({ prompt: 'select_account' });
        await A.signInWithPopup(auth, prov);
      }
      const q = F.query(F.collection(db, 'orders'), F.orderBy('createdAt', 'desc'), F.limit(500));
      let first = true;
      ordUnsub = F.onSnapshot(q, (snap) => {
        const before = new Set(orders.map(o => o.id));
        orders = []; snap.forEach(d => orders.push({ ...d.data(), id: d.id }));
        const fresh = orders.filter(o => !before.has(o.id) && o.status === 'new');

service cloud.firestore {
  match /databases/{database}/documents {
    function isAdmin() {

        && request.auth.token.email.lower() in ${JSON.stringify(emails.length ? emails : ['you@example.com'])};
    }
    match /orders/{id} {
      // shoppers can place an order; only you can list, change or delete orders
      allow create: if request.resource.data.status == 'new'
        && request.resource.data.total is number
        && request.resource.data.items is list
        && request.resource.data.items.size() > 0 && request.resource.data.items.size() <= 50
        && request.resource.data.customer.email is string;
      // a shopper can open one order with its private tracking link
      allow get: if true;
      allow list, update, delete: if isAdmin();
      match /private/{doc} {
        // the receipt is added once with the order; notes are yours only
        allow create: if (doc == 'proof' && request.resource.data.data is string && request.resource.data.data.size() < 1040000) || isAdmin();
        allow read, update, delete: if isAdmin();
      }
    }
    function prog() { return get(/databases/$(database)/documents/program/settings).data; }
    match /program/settings {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /affiliates/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow create: if request.auth != null && request.auth.uid == uid && prog().enabled == true
        && request.resource.data.status == 'pending' && request.resource.data.paid == 0
        && request.resource.data.budget == prog().budget
        && request.resource.data.commissionPct >= 0 && request.resource.data.discountPct >= 0
        && request.resource.data.commissionPct + request.resource.data.discountPct <= request.resource.data.budget;
      allow update: if isAdmin() || (request.auth != null && request.auth.uid == uid
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name', 'code', 'payout', 'commissionPct', 'discountPct', 'updatedAt'])
        && request.resource.data.commissionPct >= 0 && request.resource.data.discountPct >= 0
        && request.resource.data.commissionPct + request.resource.data.discountPct <= resource.data.budget);
      allow delete: if isAdmin();
    }
    match /codes/{code} {
      // checkout looks a code up by name; only you can list them
      allow get: if true;
      allow list: if isAdmin();
      allow create: if isAdmin() || (request.auth != null && code.matches('^[A-Z0-9]{3,20}$')
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.suspended == false && request.resource.data.clicks == 0
        && getAfter(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.code == code
        && request.resource.data.commissionPct == getAfter(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.commissionPct
        && request.resource.data.discountPct == getAfter(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.discountPct
        && (request.resource.data.approved == false || get(/databases/$(database)/documents/codes/$(get(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.code)).data.approved == true));
      allow update: if isAdmin()
        || (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['clicks']) && request.resource.data.clicks == resource.data.clicks + 1)
        || (request.auth != null && resource.data.uid == request.auth.uid
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['commissionPct', 'discountPct'])
          && request.resource.data.commissionPct == getAfter(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.commissionPct
          && request.resource.data.discountPct == getAfter(/databases/$(database)/documents/affiliates/$(request.auth.uid)).data.discountPct);
      allow delete: if isAdmin() || (request.auth != null && resource.data.uid == request.auth.uid);
    }
    match /referrals/{id} {
      // created with an order; commission can't exceed the code's rate
      allow create: if request.resource.data.status == 'new'
        && request.resource.data.commission is number && request.resource.data.base is number
        && get(/databases/$(database)/documents/codes/$(request.resource.data.code)).data.uid == request.resource.data.uid
        && request.resource.data.commission <= request.resource.data.base * get(/databases/$(database)/documents/codes/$(request.resource.data.code)).data.commissionPct / 100 + 0.01;
      allow read: if request.auth != null && (resource.data.uid == request.auth.uid || isAdmin());
      allow update, delete: if isAdmin();
    }
    match /stats/{day} {
      // anonymous daily visit counters written by the store; only you can read them
      allow read, delete: if isAdmin();
      allow create, update: if day.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
        && request.resource.data.keys().hasOnly(['views', 'visitors', 'newVisitors', 'sessions', 'addToCart', 'checkoutStarts', 'ordersPlaced', 'pages', 'products', 'cartAdds', 'refs', 'devices', 'hours'])
        && request.resource.data.get('views', 0) >= (resource == null ? 0 : resource.data.get('views', 0));
    }
    match /customers/{uid} {
      allow read, create, update: if request.auth != null && request.auth.uid == uid;
      allow read: if isAdmin();
    }
  }
}`;

    const walk = (o) => { for (const k in o) { if (o[k] && typeof o[k] === 'object') walk(o[k]); else o[k] = fix(o[k]); } };

  $('#previewReload').onclick = () => { let h = '#home'; try { h = $('#previewFrame').contentWindow.location.hash || '#home'; } catch {} openPreview(h); };
  $('#previewClose').onclick = () => { $('#preview').hidden = true; $('#previewFrame').srcdoc = ''; };
  document.addEventListener('click', (e) => {
    const pw = e.target.closest('[data-pw]'); if (pw) { $('#previewFrame').style.width = pw.dataset.pw === '100%' ? '100%' : pw.dataset.pw + 'px'; return; }
    const op = e.target.closest('[data-open-preview]'); if (op) { e.preventDefault(); openPreview('#' + op.dataset.openPreview); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#preview').hidden) $('#previewClose').click(); });

  // ---------- install a new version of the site ----------
  $('#installUpdate').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const text = await f.text();
    if (!DATA_RE.test(text) || !text.includes('window.RL')) { toast('That file is not a REGN Labs site file.'); return; }
    if (!(await confirmBox(`Install ${f.name}? Your current products, pages, images and settings will be carried over, then it publishes.`, 'Install'))) return;
    template = text; markDirty(); publishNow(); toast('Installing the update');
  });

  // ---------- backups & password ----------
  function download(name, text, type) {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('#exportJson').onclick = () => download(`regnlabs-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
  $('#importJson').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch {}
    if (!d || !d.site || !Array.isArray(d.products)) { toast('That file is not a REGN Labs backup.'); return; }
    if (!(await confirmBox(`Replace the live store with this backup (${d.products.length} products)?`, 'Restore'))) return;
    data = RL.normalize(d); renderAll(); markDirty(); toast('Backup restored');
  });
  function renderRepo() {
    $('#repoName').textContent = gh.owner ? `${gh.owner}/${gh.repo} · branch ${gh.branch}` : '';
    $('#repoLink').href = gh.owner ? `https://github.com/${gh.owner}/${gh.repo}/commits/${encodeURIComponent(gh.branch)}` : '#';
    $('#pwForm').hidden = !canEncrypt;
  }
  $('#pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#pwMsg'); msg.hidden = false; msg.className = 'err';
    if ($('#pwNew').value.length < 8) { msg.textContent = 'Use at least 8 characters.'; return; }
    if ($('#pwNew').value !== $('#pwNew2').value) { msg.textContent = 'The new passwords do not match.'; return; }
    const token = gh.token;
    try { await unlock($('#pwCur').value); } catch { gh.token = token; msg.textContent = 'Your current password is incorrect.'; return; }
    await lock($('#pwNew').value);
    e.target.reset(); msg.className = 'small'; msg.style.color = 'var(--green)'; msg.textContent = 'Password changed on this device.';
  });
  $('#forgetDevice').onclick = async () => {
    if (!(await confirmBox('Remove the saved GitHub sign-in from this browser? You will need your token to sign in here again.', 'Remove'))) return;
    vault.clear(); toast('Sign-in removed from this device'); $('#logout').click();
  };

  // ---------- compliance report ----------
  function renderCompliance() {
    const flagged = data.products.map(p => ({ p, h: scanProduct(p) })).filter(r => r.h.length);
    const noCoa = data.products.filter(p => p.status === 'active' && !p.coa);
    const siteHits = [];
    const walk = (o, path) => { for (const k in o) { const v = o[k]; if (['colors', 'logo', 'heroImage', 'favicon', 'theme', 'customCss', 'firebase', 'adminEmails', 'src', 'icon', 'formEmail', 'value', 'emails', 'affiliates'].includes(k)) continue; if (v && typeof v === 'object') walk(v, path ? `${path} › ${k}` : k); else if (typeof v === 'string') scan(v).forEach(h => siteHits.push({ field: path ? `${path} › ${k}` : k, ...h })); } };
    walk(data.site, '');
    data.pages.forEach(p => { scan(p.title).forEach(h => siteHits.push({ field: `Page "${p.navLabel || p.title}" title`, ...h })); p.sections.forEach((s, i) => scan([s.heading, s.body, s.caption, s.label, ...(s.items || []).map(x => `${x.q} ${x.a}`)].filter(Boolean).join(' \n ')).forEach(h => siteHits.push({ field: `Page "${p.navLabel || p.title}" section ${i + 1}`, ...h }))); });
    $('#complianceReport').innerHTML =
      (flagged.length ? flagged.map(r => `<div style="margin-bottom:12px"><strong class="mono">${esc(r.p.sku)}</strong> ${esc(r.p.name)}${flagsHTML(r.h)}</div>`).join('')
        : flagsHTML([], data.products.length ? 'All product copy is clear of flagged language.' : 'No products to scan yet.')) +
      `<h2 style="margin:18px 0 8px">Pages & site text</h2>` + flagsHTML(siteHits, 'All page and site text is clear of flagged language.') +
      (noCoa.length ? `<div class="flags" style="margin-top:12px"><strong>${noCoa.length} live product${noCoa.length === 1 ? '' : 's'} without a COA:</strong> ${noCoa.map(p => esc(p.sku)).join(', ')}</div>` : '');
  }

  showLogin();
})();
</script>
<script>
(() => {
  window.__RL_SOURCE = '<!doctype html>\n' + document.documentElement.outerHTML;
  const isAdmin = () => location.hash === '#admin';
  addEventListener('hashchange', () => { if (isAdmin() !== (document.body.dataset.mode === 'admin')) location.reload(); });
  if (isAdmin()) {
    document.body.dataset.mode = 'admin';
    const tpl = document.getElementById('admin-tpl');
    const code = document.getElementById('admin-js').textContent;
    document.getElementById('store-css').remove();
    document.title = 'REGN Labs Admin';
    const robots = document.createElement('meta'); robots.name = 'robots'; robots.content = 'noindex, nofollow'; document.head.appendChild(robots);
    document.body.innerHTML = '';
    document.body.appendChild(tpl.content.cloneNode(true));
    const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s);
    return;
  }
  document.body.dataset.mode = 'store';

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => (site.currency ?? '$') + Number(n || 0).toFixed(2);
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const BUILTIN_LOGO = document.querySelector('.brandlogo').getAttribute('src');
  const safeHref = (u) => /^(#|https?:\/\/|mailto:|tel:|\/)/i.test(String(u || '').trim()) ? String(u).trim() : '#' + RL.slugify(u);

  let data = { site: {}, products: [] };
  try { data = JSON.parse($('#store-data').textContent); } catch {}
  data = RL.normalize(data);
  let site = data.site, pages = data.pages, L = site.labels;
  let products = data.products.filter(p => p.status === 'active');
  let cart = ls.get('rl_cart', []).filter(l => products.some(p => p.id === l.id));
  let cat = 'All', currentId = null, qty = 1;

  // ---------- age / research-use gate ----------
  function showGate() {
    if (site.gate.enabled && !ls.get('rl_gate', false)) { $('#gate').hidden = false; document.body.style.overflow = 'hidden'; }
  }
  $('#gateYes').onclick = () => { ls.set('rl_gate', true); $('#gate').hidden = true; document.body.style.overflow = ''; };

  // ---------- text helpers ----------
  // blank line = new paragraph, lines starting with "- " = bullet list
  function rich(t) {
    return String(t || '').split(/\n\s*\n/).filter(x => x.trim()).map(block => {
      const lines = block.split('\n');
      if (lines.every(l => /^\s*[-•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${esc(l.replace(/^\s*[-•]\s+/, ''))}</li>`).join('')}</ul>`;
      return `<p>${esc(block).replace(/\n/g, '<br>')}</p>`;
    }).join('');
  }
  const setText = (sel, v) => { const el = $(sel); if (el) el.textContent = v || ''; };

  // ---------- site chrome (everything editable in the admin) ----------
  function luminance(hex) {
    const m = String(hex).replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if (!m) return 0.3;
    const [r, g, b] = m.slice(1).map(x => { const c = parseInt(x, 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function applyTheme() {
    const c = site.colors, r = document.documentElement.style;
    const ok = (v) => /^#[0-9a-f]{6}$/i.test(v || '');
    if (ok(c.accent)) { r.setProperty('--green', c.accent); r.setProperty('--on-accent', luminance(c.accent) > 0.3 ? '#03140a' : '#ffffff'); }
    if (ok(c.bg)) r.setProperty('--bg', c.bg);
    if (ok(c.surface)) r.setProperty('--surface', c.surface);
    if (ok(c.text)) r.setProperty('--text', c.text);
    document.documentElement.style.colorScheme = luminance(c.bg) > 0.5 ? 'light' : 'dark';
    const th = site.theme, R = { sharp: [2, 3, 4], soft: [6, 10, 16], round: [12, 18, 26] }[th.radius] || [6, 10, 16];
    r.setProperty('--r-sm', R[0] + 'px'); r.setProperty('--r-md', R[1] + 'px'); r.setProperty('--r-lg', R[2] + 'px');
    r.setProperty('--gcols', Math.min(5, Math.max(2, +th.gridCols || 4)));
    r.setProperty('--logo-h', Math.min(60, Math.max(14, +th.logoHeight || 24)) + 'px');
    r.setProperty('--base', Math.min(20, Math.max(13, +th.baseSize || 16)) + 'px');
    const fam = (f) => String(f || '').replace(/[^\w \-]/g, '').trim();
    const d = fam(th.displayFont) || 'Archivo', b = fam(th.bodyFont) || 'Instrument Sans';
    r.setProperty('--display', `"${d}",system-ui,sans-serif`); r.setProperty('--body', `"${b}",system-ui,-apple-system,"Segoe UI",sans-serif`);
    const href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(d)}:wght@500;600;700;800&family=${encodeURIComponent(b)}:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap`;
    let lk = document.getElementById('themeFonts');
    if (!lk) { lk = document.createElement('link'); lk.rel = 'stylesheet'; lk.id = 'themeFonts'; document.head.appendChild(lk); }
    if (lk.href !== href) lk.href = href;
    document.body.classList.toggle('nostick', !th.stickyHeader);
    document.getElementById('customCss').textContent = String(site.customCss || '').replace(/<\/style/gi, '');
  }
  function navPages() { return pages.filter(p => p.inNav); }
  function renderChrome() {
    applyTheme();
    document.title = site.seoTitle || site.brand || '';
    const md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute('content', site.seoDescription || '');

    const shipBanner = site.shipping.showInBanner && site.shipping.notice;
    $('#announcement').innerHTML = [site.showAnnouncement && site.announcement ? ann : '', shipBanner ? esc(site.shipping.notice) : ''].filter(Boolean).join('<span style="opacity:.5;margin:0 10px">·</span>');
    document.querySelectorAll('[data-shipnote]').forEach(el => { el.hidden = !(site.shipping.showInCart && site.shipping.notice); el.innerHTML = `${SHIP_ICON}<span>${esc(site.shipping.notice)}</span>`; });
    $('#maint').hidden = !site.maintenance.enabled; setText('#maintTitle', site.maintenance.title); setText('#maintText', site.maintenance.text);
    // tabs
    const tabs = [];
    if (site.showShopInNav) tabs.push(`<a href="#shop" data-r="shop">${esc(site.shopNavLabel)}</a>`);
    navPages().forEach(p => tabs.push(`<a href="#${esc(p.slug)}" data-r="${esc(p.slug)}">${esc(p.navLabel || p.title)}</a>`));
    if (affOn() && site.affiliates.showInNav) tabs.push(`<a href="#affiliate" data-r="affiliate">${esc(site.affiliates.navLabel || 'Affiliates')}</a>`);
    if (accountsOn()) tabs.push(`<a href="#account" data-r="account" id="acctTab">${esc(user ? (site.accounts.signedInLabel || (user.displayName || '').split(' ')[0] || 'Account') : site.accounts.navLabel)}</a>`);
    tabs.push(`<a href="#cart" class="cartlink" data-r="cart">${esc(L.cartNav)} <b id="count">0</b></a>`);
    $('#nav').innerHTML = tabs.join('');
    // home
    setText('#heroEyebrow', site.heroEyebrow); setText('#heroTitle', site.heroTitle); setText('#heroText', site.heroText);
    $('#heroEyebrow').hidden = !site.heroEyebrow;
    $('#heroButtons').innerHTML = (site.heroButtons || []).filter(b => b.label).map(b => `<a class="btn${b.style === 'ghost' ? ' ghost' : ''}" href="${esc(safeHref(b.link))}">${esc(b.label)}</a>`).join('');
    const hasImg = !!site.heroImage;
    $('#heroMedia').hidden = !hasImg; $('#heroIn').classList.toggle('solo', !hasImg);
    $('#heroIn').classList.toggle('img-left', hasImg && site.theme.heroImageSide === 'left');
    document.querySelector('.hero').classList.toggle('noglow', !site.theme.heroGlow);
    const hs = (site.homeSections || []).map(renderSection).join('');
    $('#homeExtra').hidden = !hs; $('#homeSections').innerHTML = hs;
    if (hasImg) { const img = $('#heroImg'); if (img.getAttribute('src') !== site.heroImage) img.src = site.heroImage; img.alt = site.heroImageAlt || ''; }
    const facts = (site.facts || []).filter(f => f.title || f.text);
    $('#factsWrap').hidden = !facts.length;
    $('#facts').style.setProperty('--cols', Math.min(4, Math.max(1, facts.length)));
    $('#facts').innerHTML = facts.map(f => `<div><strong>${esc(f.title)}</strong><span>${esc(f.text)}</span></div>`).join('');
    $('#featuredSec').hidden = !site.showFeatured;
    setText('#featuredEyebrow', site.featuredEyebrow); setText('#featuredTitle', site.featuredTitle); setText('#viewAll', site.viewAllLabel);
    $('#viewAll').hidden = !site.viewAllLabel;
    // shop + cart labels
    setText('#shopEyebrow', site.shopEyebrow); setText('#shopTitle', site.shopTitle); $('#search').placeholder = L.search;
    setText('#cartEyebrow', L.cartEyebrow); setText('#cartTitle', L.cartTitle);
    setText('#lSubtotal', L.subtotal); setText('#lShipping', L.shipping); setText('#lShippingValue', L.shippingValue); setText('#lTotal', L.total);
    setText('#checkout', L.checkout);
    // disclaimer, gate
    $('#disclaimerSec').hidden = !site.showDisclaimer;
    setText('#disclaimerTitle', site.disclaimerTitle); setText('#disclaimerText', site.disclaimer);
    setText('#gateTitle', site.gate.title); setText('#gateText1', site.gate.text1); setText('#gateText2', site.gate.text2);
    setText('#gateYes', site.gate.yes); setText('#gateLeave', site.gate.leave);
    $('#gateLeave').href = /^https?:\/\//i.test(site.gate.leaveUrl || '') ? site.gate.leaveUrl : 'https://www.google.com';
    const SL = site.sortLabels; [...$('#sort').options].forEach(o => { if (SL[o.value]) o.textContent = SL[o.value]; });
    // footer
    const H = site.footerHeadings;
    const col = (title, links) => links.length ? `<div><h4>${esc(title)}</h4><ul>${links.map(([href, label]) => `<li><a href="${esc(href)}"${/^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : ''}>${esc(label)}</a></li>`).join('')}</ul></div>` : '';
    const shopLinks = [['#shop', site.shopNavLabel], ['#cart', L.cartNav], ...(accountsOn() ? [['#account', site.accounts.signedInLabel || 'Account']] : [])];
    const info = pages.filter(p => p.footer === 'info').map(p => ['#' + p.slug, p.navLabel || p.title]);
    if (affOn() && site.affiliates.showInFooter) info.push(['#affiliate', site.affiliates.navLabel || 'Affiliates']);
    const legal = pages.filter(p => p.footer === 'legal').map(p => ['#' + p.slug, p.navLabel || p.title]);
    const extra = (site.footerLinks.links || []).filter(l => l.label && l.link).map(l => [safeHref(l.link), l.label]);
    const cols = [col(H.shop, shopLinks), col(H.info, info), col(H.legal, legal), col(site.footerLinks.title, extra)].filter(Boolean);
    $('#foot').style.setProperty('--fcols', cols.length);
    const contact = [site.businessAddress, site.contactEmail].filter(Boolean).join('\n');
    $('#foot').innerHTML = `<div class="foot-brand"><img src="${esc(site.logo || BUILTIN_LOGO)}" alt="${esc(site.brand)}">${contact ? `<p>${esc(contact)}</p>` : ''}</div>${cols.join('')}
      <div class="legal"><span>© ${new Date().getFullYear()} ${esc(site.copyright)}</span>${site.shipping.showInFooter && site.shipping.notice ? `<span>${esc(site.shipping.notice)}</span>` : ''}<span>${esc(site.footerNote)}</span></div>`;
    saveCart();
  }

  // ---------- products ----------
  const placeholder = (n) => `<div class="card placeholder"><div class="thumb">PRODUCT IMAGE</div><span class="sku">SKU-${String(n).padStart(4, '0')}</span><div class="meta"><h3>Product name</h3><span class="price">$0.00</span></div><span class="sub">Size · Purity</span></div>`;
  const card = (p) => `<div class="card"><a class="card-link" href="#product-${encodeURIComponent(p.id)}">
      <div class="thumb">${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ''}${p.images?.[0] ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy">` : esc(L.noImage)}</div>
      ${site.product.showSku ? `<span class="sku">${esc(p.sku)}</span>` : ''}
      <div class="meta"><h3>${esc(p.name)}</h3><span class="price">${money(p.price)}</span></div>
      ${site.product.showSubline ? `<span class="sub">${[p.size, p.purity && `${site.product.specLabels.purity} ${p.purity}`].filter(Boolean).map(esc).join(' · ')}</span>` : ''}
      ${site.cardTag ? `<span class="ruo-tag">${esc(site.cardTag)}</span>` : ''}</a>${site.product.cardButton ? (p.stock > 0 ? `<button type="button" class="btn small cardbtn" data-addcard="${esc(p.id)}">${esc(L.addToCart)}</button>` : `<button type="button" class="btn small ghost cardbtn" disabled>${esc(L.outOfStock)}</button>`) : ''}</div>`;
  const grid = (el, list, n) => { el.innerHTML = list.length ? list.map(card).join('') : Array.from({ length: n }, (_, i) => placeholder(i + 1)).join(''); };

  function renderHome() { const f = products.filter(p => p.featured); grid($('#featured'), (f.length ? f : products).slice(0, 4), 4); }
  function renderShop() {
    $('#cats').innerHTML = (site.categories || []).length ? [L.allCategories, ...site.categories].map((c, i) => `<button class="chip${(i ? c : 'All') === cat ? ' on' : ''}" data-cat="${esc(i ? c : 'All')}">${esc(c)}</button>`).join('') : '';

    const list = products.filter(p => (cat === 'All' || p.category === cat) && (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)));
    const s = $('#sort').value;
    if (s === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
    if (s === 'low') list.sort((a, b) => a.price - b.price);
    if (s === 'high') list.sort((a, b) => b.price - a.price);
    if (s === 'featured') list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    $('#resultcount').textContent = products.length ? `${list.length} product${list.length === 1 ? '' : 's'}` : L.emptyCatalog;
    grid($('#shopgrid'), list, products.length ? 0 : 8);
    if (products.length && !list.length) $('#shopgrid').innerHTML = `<p class="muted">${esc(L.noMatch)}</p>`;
  }
  function renderProduct(id) {

    const inStock = p.stock > 0;
