    const rows = site.product.showSpecs ? [[SLB.sku, p.sku], [SLB.size, p.size], [SLB.form, p.form], [SLB.purity, p.purity], [SLB.cas, p.cas], ...(p.specs || []).map(s => [s.k, s.v])].filter(r => r[1]) : [];
    const related = site.product.related ? products.filter(x => x.id !== p.id && (p.category ? x.category === p.category : true)).slice(0, 4) : [];
    $('#pdp').innerHTML = `
      ${site.product.showBreadcrumb ? `<div class="crumbs"><a href="#home">Home</a> / <a href="#shop">${esc(site.shopNavLabel)}</a> / ${esc(p.name)}</div>` : ''}
      <div class="pdp">
        <div class="gallery">
          <div class="thumb" id="mainimg">${imgs[0] ? `<img src="${esc(imgs[0])}" alt="${esc(p.name)}">` : esc(L.noImage)}</div>
          ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, i) => `<button data-img="${i}" class="${i ? '' : 'on'}" aria-label="Show image ${i + 1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>` : ''}

      const email = $('#aEmail').value.trim(), pass = $('#aPass').value, name = create ? $('#aName').value.trim() : '';
      if (create && !name) { acctError('Enter your name.'); return; }
      if (create && needAttest()) return;
      acctBusy = true; acctError('');
      try {
        const { A, auth } = await fbx();
        if (create) {
          const res = await A.createUserWithEmailAndPassword(auth, email, pass);
          await A.updateProfile(res.user, { displayName: name });
          await saveProfile(res.user, { name, attested: true });
          user = res.user; renderChrome(); renderAccount();
        } else {
          const res = await A.signInWithEmailAndPassword(auth, email, pass);
          await saveProfile(res.user);
        }
      } catch (err) { acctError(fbMsg(err)); }
      acctBusy = false;
    }
    if (e.target.id === 'addrForm') {
      e.preventDefault();
      const address = {}; document.querySelectorAll('[data-addr]').forEach(i => address[i.dataset.addr] = i.value.trim().slice(0, 200));
      const msg = $('#addrMsg'); msg.textContent = 'Saving…';
      try { const { F, db } = await fbx(); await F.setDoc(F.doc(db, 'customers', user.uid), { address }, { merge: true }); profile = { ...(profile || {}), address }; msg.textContent = 'Saved.'; }
      catch (err) { msg.textContent = fbMsg(err); }
    }
  });

  // ---------- motion ----------
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const io = ('IntersectionObserver' in window && !reduceMotion)
    ? new IntersectionObserver((entries) => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 })
    : null;
  const REVEAL = '.sechead, .grid > .card, .facts-in > div, .hero-copy > *, .pdp > *, .prose > *, details, .coa-link, .summary, .line, .disclaimer .wrap, .foot > div';
  function reveal() {
    if (!io) return;
    const vh = innerHeight;
    document.querySelectorAll(REVEAL).forEach(el => {
      if (el.dataset.rv || el.closest('[hidden]')) return;
      el.dataset.rv = '1';
      if (el.getBoundingClientRect().top < vh * 0.92) return;
      const sibs = el.parentElement ? [...el.parentElement.children].filter(c => c.matches(REVEAL)) : [];
      el.style.setProperty('--d', (Math.min(sibs.indexOf(el), 5) * 0.06) + 's');
      el.classList.add('rv'); io.observe(el);
    });
  }
  new MutationObserver(() => requestAnimationFrame(reveal)).observe(document.querySelector('main'), { childList: true, subtree: true });

  // cover image: fades up on load, then drifts gently and zooms a touch as the page scrolls
  const media = $('#heroMedia');
  function heroEnter() {
    if (reduceMotion) { media.classList.add('in'); return; }
    const img = $('#heroImg');
    const go = () => requestAnimationFrame(() => media.classList.add('in'));
    if (img.complete) setTimeout(go, 120); else { img.addEventListener('load', go, { once: true }); img.addEventListener('error', go, { once: true }); }
  }
  let ticking = false;
  function parallax() {
    ticking = false;
    if (reduceMotion || media.hidden || media.closest('[hidden]')) return;
    const r = media.getBoundingClientRect();
    const progress = Math.max(-1, Math.min(1, (r.top + r.height / 2 - innerHeight / 2) / innerHeight));
    media.style.setProperty('--py', (progress * 36).toFixed(1) + 'px');
    media.style.setProperty('--ps', (1.04 - Math.abs(progress) * 0.04).toFixed(4));
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(parallax); } }, { passive: true });
  addEventListener('resize', parallax);

  // ---------- routing ----------
  function route(keepScroll) {
    const r = (location.hash || '#home').slice(1);
    let view = r, page = null;
    if (r.startsWith('product-')) { view = 'product'; renderProduct(decodeURIComponent(r.slice(8))); }
    else if (r === 'account' && accountsOn()) { view = 'account'; renderAccount(); }
    else if (r === 'checkout') { view = 'checkout'; renderCheckout(); }
    else if (r.startsWith('order-')) { view = 'done'; renderDone(decodeURIComponent(r.slice(6))); }
    else if (r.startsWith('track-')) { view = 'done'; renderTrack(decodeURIComponent(r.slice(6))); }
    else if (r === 'affiliate') { view = 'affiliate'; if (!keepScroll) { affTab = 'overview'; renderAffiliate(true); } }
    else if (!['home', 'shop', 'cart'].includes(r)) { page = pages.find(p => p.slug === r); view = page ? 'page' : 'home'; if (page) renderPage(page); }
    document.querySelectorAll('[data-view]').forEach(el => el.hidden = el.dataset.view !== view);
    document.querySelectorAll('#nav [data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === (page ? page.slug : view === 'checkout' ? 'cart' : view)));
    if (!keepScroll) track('view', view === 'product' ? 'product' : page ? page.slug : view, view === 'product' ? currentId : null);
    if (view === 'home') { renderHome(); parallax(); }
    if (view === 'shop') renderShop();
    if (view === 'cart') renderCart();
    if (!keepScroll) window.scrollTo(0, 0);
    requestAnimationFrame(reveal);
  }
  addEventListener('hashchange', () => route());

  // ---------- live updates ----------
  // When the admin publishes, the host redeploys this file. Open pages check for a newer copy every minute.
  const SELF = location.href.split('#')[0].split('?')[0];
  const DATA_RE = /<script id="store-data" type="application\/json">([\s\S]*?)<\/script>/;
  let liveStamp = (data.meta && data.meta.savedAt) || '';
  async function refresh() {
    if (location.protocol === 'file:') return;
    try {
      const r = await fetch(`${SELF}?v=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(DATA_RE);
      if (!m) return;
      const j = RL.normalize(JSON.parse(m[1]));
      const stamp = (j.meta && j.meta.savedAt) || '';
      if (!stamp || stamp === liveStamp) return;
      liveStamp = stamp; data = j; site = j.site; pages = j.pages; L = site.labels;
      products = j.products.filter(p => p.status === 'active');
      cart = cart.filter(l => products.some(p => p.id === l.id));
      renderChrome(); startAccounts();
      const onProduct = location.hash.startsWith('#product-');
      if (!onProduct || !products.some(p => p.id === currentId)) route(true);
    } catch {}
  }

  // ---------- anonymous visit statistics (for the admin's Statistics tab) ----------
  // No cookies or personal data: one counter document per day in your Firebase.
  let statQ = null, statTimer = null;
  const statKey = (k) => String(k || 'unknown').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 60) || 'unknown';
  function statsOn() {
    if (!site.stats || site.stats.enabled === false || !RL.parseFirebase(site.accounts.firebase)) return false;
    if (!/^https?:$/.test(location.protocol) || /bot|crawl|spider|slurp|preview|lighthouse/i.test(navigator.userAgent)) return false;
    return !ls.get('rl_nostats', false);
  }
  function statAdd(path, n = 1) {
    if (!statQ) statQ = {};
    const ks = path.split('.'); let o = statQ;
    ks.slice(0, -1).forEach(k => { o[k] = o[k] || {}; o = o[k]; });
    o[ks[ks.length - 1]] = (o[ks[ks.length - 1]] || 0) + n;
    clearTimeout(statTimer); statTimer = setTimeout(statFlush, 3000);
  }
  async function statFlush() {
    if (!statQ) return; const q = statQ; statQ = null;
    try {
      const { F, db } = await RL.firebase(site.accounts.firebase);
      const inc = (o) => { const r = {}; for (const k in o) r[k] = typeof o[k] === 'number' ? F.increment(o[k]) : inc(o[k]); return r; };
      await F.setDoc(F.doc(db, 'stats', new Date().toISOString().slice(0, 10)), inc(q), { merge: true });
    } catch {}
  }
  addEventListener('pagehide', statFlush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) statFlush(); });
  let statStarted = false;
  function track(kind, a, b) {
    if (!statsOn()) return;
    if (!statStarted) {
      statStarted = true;
      const day = new Date().toISOString().slice(0, 10);
      if (ls.get('rl_vday', '') !== day) { ls.set('rl_vday', day); statAdd('visitors'); if (!ls.get('rl_first', '')) { ls.set('rl_first', day); statAdd('newVisitors'); } }
      let fresh = false; try { fresh = !sessionStorage.getItem('rl_sess'); sessionStorage.setItem('rl_sess', '1'); } catch {}
      if (fresh) {
        statAdd('sessions');
        const w = Math.min(screen.width || innerWidth, innerWidth);
        statAdd('devices.' + (w < 640 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop'));
        statAdd('hours.h' + new Date().getHours());
        let src = 'direct';
        try { const r = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : ''; if (r && r !== location.hostname.replace(/^www\./, '')) src = r; } catch {}
        const u = new URLSearchParams(location.search).get('utm_source');
        statAdd('refs.' + statKey(u ? 'utm:' + u : src));
      }
    }
    if (kind === 'view') { statAdd('views'); statAdd('pages.' + statKey(a)); if (a === 'product' && b) statAdd('products.' + statKey(b)); }
    if (kind === 'cart') { statAdd('addToCart'); if (a) statAdd('cartAdds.' + statKey(a), b || 1); }
    if (kind === 'checkout') statAdd('checkoutStarts');
    if (kind === 'order') { statAdd('ordersPlaced'); statFlush(); }
  }

  renderChrome(); route(); showGate(); heroEnter(); startAccounts();
  addEventListener('pageshow', () => { $('#sending').hidden = true; const b = $('#placeOrder'); if (b) { b.disabled = false; b.textContent = site.checkout.placeOrder; } });
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
